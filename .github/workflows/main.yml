name: Build KICK LAB

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            extra: -A x64
          - name: macOS
            os: macos-latest
            extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.extra }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: KickLab-VST3-${{ matrix.name }}
          path: build/KickLab_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: KickLab-Standalone-${{ matrix.name }}
          path: build/KickLab_artefacts/Release/Standalone/
          if-no-files-found: error
